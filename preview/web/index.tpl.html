<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BottleOps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/*CSS*/
</style>
<div class="app">
  <header class="top">
    <div class="brand"><b>BottleOps</b><span>Bottle Co · 2 filling lines · sample data</span></div>
    <div class="hclock" id="hclock" role="timer" aria-live="off" aria-label="Current date, time and shift">
      <div class="hd"><b id="hDate">Thu 3 Sep</b><small id="hDay">2026 · Day 3 of 14</small></div>
      <div class="ht tn" id="hTime">07:30</div>
      <div class="hs sA" id="hShift"><i></i><span id="hShiftN">Shift A</span><small id="hShiftT">00:00–08:00</small></div>
    </div>
    <div class="acts">
    <button class="chip ok" id="safeBtn" aria-label="Why you can trust the answers"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.8 12.2l2.4 2.4 4-4.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="hide-s">Answers only from data</span></button>
    <button class="iconbtn" id="themeBtn" aria-label="Appearance"></button>
    </div>
  </header>
  <section class="floor" id="floor" aria-label="Production floor"><canvas id="floorCv" role="img" aria-label="Two bottling lines with moving bottles"></canvas></section>
  <nav class="seg tabs" id="tabs" role="tablist" aria-label="Panels"></nav>
  <main class="panes">
    <section class="pane card show" id="paneEx" aria-label="Data Explorer">
      <div class="phead"><div class="avatar ex"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span></div>
        <div class="tt"><b>Data Explorer</b><span>Reads only data up to the time bar</span></div>
        <button class="iconbtn" id="exGear" aria-label="Data Explorer settings"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span></button></div>
      <div class="chat" id="chatLog" aria-live="polite"></div>
      <div class="sugs" id="sugs"></div>
      <form class="composer" id="chatForm" autocomplete="off"><input id="chatIn" type="text" placeholder="Ask about Line 1 or Line 2" aria-label="Ask a question" enterkeyhint="send"><button class="send" id="sendBtn" type="submit" aria-label="Send"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></form>
    </section>
    <section class="pane card" id="paneWa" aria-label="Production Monitor">
      <div class="phead"><div class="avatar wa"><span class="ico"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span></div>
        <div class="tt"><b>Production Monitor</b><span>Watches 5 signals on both lines, live</span></div>
        <button class="iconbtn" id="waGear" aria-label="Monitor settings"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span></button></div>
      <div class="wbody" id="watchBody"></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="Report"></div>
    </section>
  </main>
  <footer class="drawer glass" id="drawer" aria-label="Time controls"></footer>
</div>

/*SIM*/
</script>
