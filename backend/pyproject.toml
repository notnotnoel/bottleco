[project]
name = "bottleco"
version = "0.3.0"
description = "BottleCo agents: Data Kit, KPIs and alert engine (agents follow in phases 4-5)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bottleco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
