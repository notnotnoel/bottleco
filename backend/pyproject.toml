[project]
name = "bottleco"
version = "0.4.0"
description = "BottleCo agents: Data Kit, KPIs, alert engine, Line Watcher"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2", "langchain-anthropic>=1.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bottleco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
